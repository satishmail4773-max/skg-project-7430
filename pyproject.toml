[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specsentinel"
version = "0.2.0"
description = "Stateless API and agent-readiness test-pack compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
specsentinel = "specsentinel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specsentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
